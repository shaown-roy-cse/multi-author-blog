{% extends 'base.html' %}


{% block content %}


<div class="row justify-content-center">


<div class="col-md-7">


<div class="card shadow">


<div class="card-body">


<h2 class="text-center mb-4">
    Edit Post
</h2>



<form method="POST">


{% csrf_token %}



<div class="mb-3">


<label class="form-label">
    Title
</label>


<input
    type="text"
    name="title"
    class="form-control"
    value="{{ post.title }}"
    required>


</div>





<div class="mb-3">


<label class="form-label">
    Content
</label>


<textarea
    name="content"
    class="form-control"
    rows="6"
    required>{{ post.content }}</textarea>


</div>





<button type="submit"
        class="btn btn-warning">

    Update Post

</button>



<a href="{% url 'post_detail' post.id %}"
   class="btn btn-secondary">

    Cancel

</a>



</form>



</div>


</div>


</div>


</div>



{% endblock %}
